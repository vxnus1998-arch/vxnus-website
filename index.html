<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VXNUS</title>

    <link rel="stylesheet" href="./style.css?v=2">

</head>

<body>

    <!-- ================= HERO ================= -->

    <section class="hero">

        <video autoplay muted loop playsinline preload="auto" class="background-video">
            <source src="city-loop.mp4" type="video/mp4">
        </video>

        <div class="overlay"></div>

        <div class="hero-content">

            <h1>VXNUS</h1>

            <p>Every Moment Tells A Story</p>

            <a href="#about" class="enter-button">

                <span>Enter New World</span>

                <span class="arrow">&#8964;</span>

            </a>

        </div>

    </section>



    <!-- ================= THE ARTIST ================= -->

    <section id="about" class="artist-section">

        <video autoplay muted loop playsinline preload="auto" class="artist-background-video">

            <source src="city-view.mp4" type="video/mp4">

        </video>

        <div class="artist-overlay"></div>

        <div class="artist-content">

            <div class="artist-text">

                <h2>The Artist</h2>

                <h3>"What defines identity?"</h3>

                <p>Every moment shapes a larger story.</p>

                <p>VXNUS explores emotion, atmosphere, and storytelling through music.</p>

                <p>Everything has a deeper meaning.</p>

                <a href="#" class="discover-button">

                    Discover More →

                </a>

            </div>

        </div>

    </section>



    <!-- ================= STORY IMAGINED ================= -->

    <section id="story" class="story-section">

        <!-- Intro Video -->

        <video
            id="storyIntro"
            class="story-background-video active"
            muted
            playsinline>
            preload="auto">

            <source src="eyes-open.mp4" type="video/mp4">

        </video>

        <!-- Endless Loop -->

        <video
            id="storyLoop"
            class="story-background-video story-loop"
            muted
            loop
            playsinline>
            preload="auto">

            <source src="eyes-open-cont.mp4" type="video/mp4">

        </video>

        <div class="story-overlay"></div>



        <div class="story-content">

            <h2>The Story Imagined</h2>

            <p>Click an album to learn more</p>

        </div>



        <!-- CREATION -->

        <a href="#" class="album creation">

            <img
                class="album-image"
                src="creation.jpg"
                alt="Creation">

            <video
                class="album-video"
                muted
                loop
                playsinline>

                <source src="creation.mp4" type="video/mp4">

            </video>

        </a>

    </section>



    <script src="script.js"></script>

</body>

</html>
